<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tokyo Member System</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-white rounded-3xl shadow-2xl overflow-hidden border-4 border-amber-500">
        
        <div id="sellerStep" class="p-6">
            <div class="text-center mb-4">
                <span class="bg-amber-100 text-amber-800 text-xs font-bold px-3 py-1 rounded-full">ฝั่งพ่อค้า</span>
                <h1 class="text-xl font-bold text-gray-800 mt-2">🥞 บันทึกยอดขายโตเกียว</h1>
            </div>

            <div class="bg-gradient-to-r from-amber-500 to-orange-500 p-4 rounded-2xl text-white text-center mb-6 shadow-md">
                <p class="text-xs uppercase tracking-wider text-amber-100 font-medium">ยอดขายรวมวันนี้</p>
                <h3 id="todaySalesDisplay" class="text-3xl font-black mt-1">⏳ กำลังโหลด...</h3>
            </div>
            
            <div class="space-y-6">
                <div>
                    <label class="block text-sm font-semibold text-gray-600 mb-2">ยอดเงินรวม (บาท)</label>
                    <input type="number" id="salesAmount" placeholder="0.00" 
                        class="w-full px-4 py-4 border-2 border-gray-200 rounded-2xl text-3xl font-bold text-center text-amber-600 focus:outline-none focus:border-amber-500">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-600 mb-2">เลือกประเภทการชำระเงินเพื่อไปต่อ</label>
                    <div class="grid grid-cols-2 gap-4">
                        <button type="button" onclick="selectPayment('Cash')"
                            class="py-4 font-bold border-2 border-amber-200 rounded-2xl bg-amber-50 text-amber-700 hover:bg-amber-100 transition active:scale-95 text-center block text-lg shadow-sm">
                            💵 เงินสด
                        </button>
                        <button type="button" onclick="selectPayment('QR')"
                            class="py-4 font-bold border-2 border-orange-200 rounded-2xl bg-orange-50 text-orange-700 hover:bg-orange-100 transition active:scale-95 text-center block text-lg shadow-sm">
                            📱 โอนจ่าย
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div id="qrStep" class="p-6 hidden text-center bg-stone-50 relative">
            <button onclick="backToEditPayment()" class="absolute top-6 left-6 text-sm font-medium text-gray-400 hover:text-gray-600 flex items-center gap-1">
                ⬅️ ย้อนกลับ
            </button>

            <div class="mt-4">
                <span class="bg-orange-100 text-orange-800 text-xs font-bold px-3 py-1 rounded-full">📱 ช่องทางโอนเงิน</span>
                <p class="text-gray-500 text-sm mt-3">ยอดเงินที่ต้องชำระ</p>
                <h2 id="displayQrAmount" class="text-4xl font-extrabold text-orange-600 my-2">0 บาท</h2>
                
                <div class="bg-white p-4 rounded-3xl border-2 border-orange-200 shadow-inner my-4 max-w-[240px] mx-auto">
                    <img src="https://res.cloudinary.com/ddz0j6l4d/image/upload/v1782881862/QR_PP_i8uzy4.webp" 
                        alt="QR Payment" class="w-full h-auto rounded-xl">
                </div>

                <p class="text-xs text-gray-400 mb-6">เมื่อโอนสำเร็จแล้ว กดปุ่มด้านล่างเพื่อสะสมแต้ม</p>

                <button onclick="goToCustomerStep()" 
                    class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-4 rounded-2xl text-lg transition shadow-lg shadow-orange-200 animate-bounce">
                    จ่ายแล้ว ไปสะสมแต้มกันเลย ➡️
                </button>
            </div>
        </div>

        <div id="customerStep" class="p-6 hidden bg-amber-50 relative">
            <button onclick="backToEditPayment()" class="absolute top-6 left-6 text-sm font-medium text-gray-400 hover:text-gray-600 flex items-center gap-1">
                ⬅️ ย้อนกลับ
            </button>

            <div class="text-center mb-4 mt-4">
                <span class="bg-green-100 text-green-800 text-xs font-bold px-3 py-1 rounded-full">ฝั่งลูกค้า</span>
                <p class="text-gray-500 text-sm mt-2">ยอดซื้อของคุณคือ</p>
                <h2 id="displayAmount" class="text-4xl font-extrabold text-amber-600 my-1">0 บาท</h2>
                <p class="text-sm text-gray-600 font-medium">กดเบอร์โทรศัพท์เพื่อสะสมแต้มจัดแรงค์ได้เลย!</p>
            </div>

            <input type="text" id="customerPhone" readonly placeholder="กดเบอร์ที่นี่"
                class="w-full bg-white px-4 py-3 border-2 border-amber-300 rounded-xl text-2xl font-bold text-center tracking-widest text-gray-700 mb-4 shadow-inner">

            <div class="grid grid-cols-3 gap-3 mb-4">
                <button onclick="pressNum('1')" class="bg-white hover:bg-amber-100 text-gray-800 font-bold py-4 rounded-xl text-xl shadow-sm border border-gray-100 active:scale-95 transition">1</button>
                <button onclick="pressNum('2')" class="bg-white hover:bg-amber-100 text-gray-800 font-bold py-4 rounded-xl text-xl shadow-sm border border-gray-100 active:scale-95 transition">2</button>
                <button onclick="pressNum('3')" class="bg-white hover:bg-amber-100 text-gray-800 font-bold py-4 rounded-xl text-xl shadow-sm border border-gray-100 active:scale-95 transition">3</button>
                <button onclick="pressNum('4')" class="bg-white hover:bg-amber-100 text-gray-800 font-bold py-4 rounded-xl text-xl shadow-sm border border-gray-100 active:scale-95 transition">4</button>
                <button onclick="pressNum('5')" class="bg-white hover:bg-amber-100 text-gray-800 font-bold py-4 rounded-xl text-xl shadow-sm border border-gray-100 active:scale-95 transition">5</button>
                <button onclick="pressNum('6')" class="bg-white hover:bg-amber-100 text-gray-800 font-bold py-4 rounded-xl text-xl shadow-sm border border-gray-100 active:scale-95 transition">6</button>
                <button onclick="pressNum('7')" class="bg-white hover:bg-amber-100 text-gray-800 font-bold py-4 rounded-xl text-xl shadow-sm border border-gray-100 active:scale-95 transition">7</button>
                <button onclick="pressNum('8')" class="bg-white hover:bg-amber-100 text-gray-800 font-bold py-4 rounded-xl text-xl shadow-sm border border-gray-100 active:scale-95 transition">8</button>
                <button onclick="pressNum('9')" class="bg-white hover:bg-amber-100 text-gray-800 font-bold py-4 rounded-xl text-xl shadow-sm border border-gray-100 active:scale-95 transition">9</button>
                <button onclick="clearNum()" class="bg-red-100 hover:bg-red-200 text-red-600 font-bold py-4 rounded-xl text-lg shadow-sm active:scale-95 transition">ลบ</button>
                <button onclick="pressNum('0')" class="bg-white hover:bg-amber-100 text-gray-800 font-bold py-4 rounded-xl text-xl shadow-sm border border-gray-100 active:scale-95 transition">0</button>
                <button onclick="submitPoints()" class="bg-green-500 hover:bg-green-600 text-white font-bold py-4 rounded-xl text-lg shadow-md active:scale-95 transition">ตกลง</button>
            </div>

            <button onclick="backToResetAll()" class="w-full text-center text-sm text-gray-400 hover:text-gray-600 underline">
                ยกเลิกออเดอร์นี้ (เริ่มใหม่ทั้งหมด)
            </button>
        </div>

    </div>

    <script>
        let currentSales = 0;
        let selectedPaymentMethod = ""; 
        
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzQeSeNwC8Oy4zr99FYWlcleWiDXA4Ksazw-0YYB75EvGR1I6XveYMeOJxTEzORFDA/exec"; 

        window.onload = function() {
            fetch(SCRIPT_URL)
            .then(res => res.json())
            .then(data => {
                document.getElementById('todaySalesDisplay').innerText = data.todaySales.toLocaleString() + " บาท";
            })
            .catch(err => {
                document.getElementById('todaySalesDisplay').innerText = "โหลดไม่สำเร็จ";
            });
        };

        function selectPayment(method) {
            const amount = document.getElementById('salesAmount').value;
            if (!amount || amount <= 0) {
                alert('กรุณาใส่ยอดขายก่อนครับพ่อค้า!');
                return;
            }
            
            currentSales = amount;
            selectedPaymentMethod = method;
            document.getElementById('displayAmount').innerText = currentSales + " บาท";
            document.getElementById('displayQrAmount').innerText = currentSales + " บาท";

            document.getElementById('sellerStep').classList.add('hidden');

            if(method === 'Cash') {
                document.getElementById('customerStep').classList.remove('hidden');
            } else if (method === 'QR') {
                document.getElementById('qrStep').classList.remove('hidden');
            }
        }

        function backToEditPayment() {
            document.getElementById('customerStep').classList.add('hidden');
            document.getElementById('qrStep').classList.add('hidden');
            document.getElementById('sellerStep').classList.remove('hidden');
            document.getElementById('customerPhone').value = ""; 
            selectedPaymentMethod = ""; 
        }

        function goToCustomerStep() {
            document.getElementById('qrStep').classList.add('hidden');
            document.getElementById('customerStep').classList.remove('hidden');
        }

        function pressNum(num) {
            const phoneInput = document.getElementById('customerPhone');
            if (phoneInput.value.length < 10) {
                phoneInput.value += num;
            }
        }

        function clearNum() {
            const phoneInput = document.getElementById('customerPhone');
            phoneInput.value = phoneInput.value.slice(0, -1);
        }

        function backToResetAll() {
            document.getElementById('customerStep').classList.add('hidden');
            document.getElementById('qrStep').classList.add('hidden');
            document.getElementById('sellerStep').classList.remove('hidden');
            document.getElementById('customerPhone').value = "";
            document.getElementById('salesAmount').value = "";
            selectedPaymentMethod = "";
            currentSales = 0;
        }

        function submitPoints() {
            const phone = document.getElementById('customerPhone').value;
            if (phone.length < 10) {
                alert('กรุณากรอกเบอร์โทรศัพท์ให้ครบ 10 หลักครับ');
                return;
            }

            const pointsCalculated = Math.floor(currentSales / 10); 
            const submitBtn = document.querySelector("button[onclick='submitPoints()']");
            submitBtn.innerText = "⏳...";
            submitBtn.disabled = true;

            fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'cors', 
                headers: {
                    'Content-Type': 'text/plain',
                },
                body: JSON.stringify({
                    phone: phone,
                    sales: currentSales,
                    points: pointsCalculated,
                    payment: selectedPaymentMethod 
                })
            })
            .then(res => res.json())
            .then(data => {
                if(data.status === "success") {
                    // 🎉 แก้ไขกล่องข้อความแจ้งเตือนให้แสดงแต้มรวมทั้งหมดของลูกค้า
                    alert(`🎉 บันทึกสำเร็จ!\n\n📞 เบอร์: ${phone}\n➕ ได้รับเพิ่ม: ${pointsCalculated} แต้ม\n⭐ แต้มสะสมรวมทั้งหมด: ${data.totalPoints} แต้ม`);
                    document.getElementById('todaySalesDisplay').innerText = data.todaySales.toLocaleString() + " บาท";
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('บันทึกข้อมูลแล้ว! (แต่การคำนวณแต้มรวมอาจล่าช้าเล็กน้อย)');
            })
            .finally(() => {
                submitBtn.innerText = "ตกลง";
                submitBtn.disabled = false;
                backToResetAll(); 
            });
        }
    </script>
</body>
</html>
